name: Bug report
description: Something is broken or behaving incorrectly
title: "fix: "
labels: ["kind/fix", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        If macOS refuses to open the app, that is expected and not a bug: see
        [USAGE.md](https://github.com/DaleDouglasUK/panda_rgb_mac_client/blob/main/USAGE.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Which build
      description: The "Built from" commit shown in the release notes you downloaded.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and hardware
      placeholder: "macOS 15.2, Apple silicon"
    validations:
      required: true
